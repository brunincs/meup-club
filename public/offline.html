<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#32113f">
  <title>Sem conexão | Me,up Club</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #32113f 0%, #5c005a 50%, #32113f 100%);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #edf0f1;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 320px;
      width: 100%;
    }

    .plane {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      animation: float 3s ease-in-out infinite;
    }

    .plane img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(162, 121, 55, 0.3));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      color: #a27937;
      margin-bottom: 16px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #ddd1d0;
      margin-bottom: 32px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 28px;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .btn-primary {
      background: #a27937;
      color: #1f1f1f;
      box-shadow: 0 4px 16px rgba(162, 121, 55, 0.3);
    }

    .btn-primary:hover {
      background: #c9a962;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(162, 121, 55, 0.4);
    }

    .btn-outline {
      background: transparent;
      color: #ddd1d0;
      border: 1px solid #ddd1d0;
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #edf0f1;
      border-color: #edf0f1;
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .logo {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.6;
    }

    .logo img {
      height: 32px;
      width: auto;
    }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/brand/meup-club-logo-dark.svg" alt="Me,up Club">
  </div>

  <div class="container">
    <div class="plane">
      <img src="/brand/meup-club-icon.svg" alt="">
    </div>

    <h1>Sem conexão</h1>

    <p>
      Suas viagens aparecem assim que a internet voltar.
      Enquanto isso, estamos aqui se precisar de ajuda.
    </p>

    <div class="buttons">
      <a
        href="https://wa.me/5516988126568"
        class="btn btn-primary"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Falar com a Me,up
      </a>

      <button
        onclick="location.reload()"
        class="btn btn-outline"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"></path>
        </svg>
        Tentar novamente
      </button>
    </div>
  </div>
</body>
</html>
