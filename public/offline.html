<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#32113f">
  <title>Sem conexão | Me,up Club</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #32113f 0%, #5c005a 50%, #32113f 100%);
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #edf0f1;
      padding: 24px;
      text-align: center;
    }

    .container {
      max-width: 400px;
    }

    .plane {
      font-size: 80px;
      margin-bottom: 24px;
      filter: drop-shadow(0 4px 12px rgba(162, 121, 55, 0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      color: #a27937;
      margin-bottom: 16px;
    }

    p {
      font-size: 14px;
      line-height: 1.6;
      color: #ddd1d0;
      margin-bottom: 32px;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 28px;
      background: #a27937;
      color: #1f1f1f;
      text-decoration: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(162, 121, 55, 0.3);
    }

    .whatsapp-btn:hover {
      background: #c9a962;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(162, 121, 55, 0.4);
    }

    .whatsapp-btn svg {
      width: 20px;
      height: 20px;
    }

    .logo {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.6;
    }

    .logo img {
      height: 32px;
      width: auto;
    }

    .retry-link {
      margin-top: 24px;
      color: #a39695;
      font-size: 12px;
      text-decoration: none;
    }

    .retry-link:hover {
      color: #ddd1d0;
    }
  </style>
</head>

  <div class="logo">
    <img src="/brand/meup-club-logo-dark.svg" alt="Me,up Club">
  </div>

  <div class="container">
